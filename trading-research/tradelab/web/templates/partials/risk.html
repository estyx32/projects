<div class="card">
  <h2>Risk limits</h2>
  {% for i in risk.meters %}
  <div class="meter">
    <div class="meter-head">
      <span>{{ i.label }}</span>
      <span class="mono">{{ i.used | num(i.digits) }}{{ i.unit }} of {{ i.limit | num(0) }}{{ i.unit }}</span>
    </div>
    <div class="bar" role="progressbar" aria-label="{{ i.label }}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ i.share }}">
      <div class="fill {{ i.level }}" data-width="{{ i.share }}"></div>
    </div>
  </div>
  {% endfor %}
</div>
