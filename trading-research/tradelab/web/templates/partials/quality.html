<div class="card">
  <h2>Data quality</h2>
  {% if not quality.findings %}
    <p><span class="pill ok">clean</span> All integrity checks passed.</p>
  {% else %}
  <ul class="findings">
    {% for f in quality.findings %}
    <li><span class="pill {{ 'bad' if f.severity == 'error' else 'warn' }}">{{ f.severity }}</span> {{ f.detail }}</li>
    {% endfor %}
  </ul>
  {% endif %}
</div>
