[project]
name = "tradelab"
version = "0.1.0"
description = "Auditable data layer for a personal trading research workflow"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ingest = ["youtube-transcript-api>=1.0"]
web = ["fastapi", "uvicorn", "jinja2", "python-multipart", "httpx"]
dev = ["pytest", "ruff", "black"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"tradelab.web" = ["templates/**/*.html", "static/*"]

[tool.ruff]
line-length = 110
