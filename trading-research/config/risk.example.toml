# Copy to config/risk.toml, choose YOUR OWN limits, then set config_reviewed = true.
# The numbers below are placeholders so the file parses. They are not recommendations.
# The engine refuses to start while config_reviewed is false.

config_reviewed = false

account_equity = 10000          # starting equity until equity snapshots exist

# sizing and exposure
risk_per_trade_pct = 0.5
max_long_position_pct = 5
max_short_position_pct = 2.5
max_gross_exposure_pct = 50
max_order_notional = 1000
max_open_positions = 6

# loss limits (these are circuit breakers; the engine stops approving when hit)
max_daily_loss_pct = 2
max_drawdown_pct = 8

# pre-trade checks
price_tolerance_pct = 3         # entry must be this close to the last close
max_price_age_days = 4          # prices older than this count as stale
max_short_interest_pct = 15
earnings_blackout_days = 3

# stops and exits
atr_stop_multiple = 2
trail_atr_multiple = 2
time_stop_days = 60
targets = [[1.0, 0.33], [2.0, 0.33]]   # [R multiple, fraction of position sold]

# regime and global picture
vix_risk_on_level = 18
vix_risk_off_level = 25
global_shock_pct = 3            # pause new longs if a watched index falls this much in a day
block_longs_in_risk_off = true
block_shorts_in_risk_on = true

# only these tickers can ever be traded
allowlist = ["AAPL", "MSFT", "XOM"]
